services:
  frontend:
    build:
      context: .
    command: npm run dev -- --host 0.0.0.0 --port 5193
    env_file:
      - path: .env.local
        required: false
    ports:
      - "5193:5193"
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://host.docker.internal:9090}
      WS_PROXY_TARGET: ${WS_PROXY_TARGET:-ws://host.docker.internal:9090}
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - deciscope

networks:
  deciscope:
    name: ${DECISCOPE_DOCKER_NETWORK:-deciscope}

volumes:
  frontend_node_modules:
