name: Publish container

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/deciscope-web

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: deciscope-web-prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Create runtime container definition
        run: |
          cat > Dockerfile.runtime <<'EOF'
          FROM node:20-alpine
          WORKDIR /app
          COPY package.json package-lock.json ./
          RUN npm ci --omit=dev && npm cache clean --force
          COPY build ./build
          ENV NODE_ENV=production
          ENV HOST=0.0.0.0
          ENV PORT=3000
          EXPOSE 3000
          CMD ["npm", "run", "start"]
          EOF

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update Kubernetes manifests in yd-network
        env:
          INFRA_REPO_PAT: ${{ secrets.INFRA_REPO_PAT }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="sha-${GITHUB_SHA::7}"
          
          git clone https://x-access-token:${INFRA_REPO_PAT}@github.com/yukiidayo/yd-network.git infra
          cd infra
          
          # Force lowercase since GitHub owner could be u22-DeciScope
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          sed -i "s|image: ghcr.io/u22-deciscope/deciscope-web:.*|image: ghcr.io/${REPO_OWNER}/deciscope-web:${SHORT_SHA}|g" k8s/manifests/deciscope/web.yaml
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/manifests/deciscope/web.yaml
          git commit -m "chore(web): deploy ${SHORT_SHA}" || echo "No changes to commit"
          git push origin main
